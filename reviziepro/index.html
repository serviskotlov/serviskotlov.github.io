<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReviziePRO – OPaOS OPZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical work tool for a gas inspector, calm and exact
   IDEA: the inspector's report pad – numbered sheets, stamped verdict
   PICTURE: the live verdict strip (záver + termíny) always beside the form
   COLOUR and TYPE: paper white / graphite, gas-pipe yellow accent, alarm red; Inter Tight + Inter
   LAYOUT: top bar, step tabs, one calm form column + sticky verdict panel; stacks below 900px */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f6,#141618);--card:light-dark(#fff,#1d2023);--ink:light-dark(#16181a,#eceef0);--mut:light-dark(#5d646b,#a3aab1);--line:light-dark(#dde1e5,#30353a);--acc:#f2c200;--accInk:#16181a;--red:light-dark(#c81e12,#ff6a5c);--grn:light-dark(#18794e,#5fd39a);--amb:light-dark(#9a6700,#f0b93a);--fld:light-dark(#fbfbfc,#24282c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;line-height:1.15;margin:0}
h2{font-size:22px;margin-bottom:14px}h3{font-size:16px;margin:18px 0 8px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(3vw,14px);background:#16181a;color:#fff;border-bottom:4px solid var(--acc)}
header h1{font-size:20px}header h1 b{color:var(--acc)}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main button{background:none;border:0;color:#cfd4d9;font:600 14px Inter;padding:10px 14px;border-radius:8px;cursor:pointer;min-height:44px}
nav.main button.on{background:var(--acc);color:var(--accInk)}
main{padding:18px max(3vw,14px) 60px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter;padding:9px 14px;border-radius:8px;cursor:pointer;min-height:42px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}.btn.dan{color:var(--red)}.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.grid .w2{grid-column:span 2}@media(max-width:520px){.grid .w2{grid-column:auto}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
label.f>span.req::after{content:" *";color:var(--red)}
input,select,textarea{font:16px Inter;color:var(--ink);background:var(--fld);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:#b08c00}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);min-height:36px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scroll-snap-type:x proximity}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13px Inter;cursor:pointer;min-height:40px;scroll-snap-align:start}
.steps button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.steps button .dot.w{background:var(--amb)}.steps button .dot.e{background:var(--red)}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:900px){.lay{grid-template-columns:minmax(0,1fr)}}
aside.verdict{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
@media(max-width:900px){aside.verdict{position:static;order:-1}}
.stamp{border:3px solid var(--grn);color:var(--grn);border-radius:10px;padding:12px 14px;font:700 17px/1.25 "Inter Tight";transform:rotate(-1deg)}
.stamp.w{border-color:var(--amb);color:var(--amb)}.stamp.e{border-color:var(--red);color:var(--red)}
.terms{width:100%;border-collapse:collapse;font-size:14px}.terms td,.terms th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.terms td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.msg{font-size:13px;padding:7px 10px;border-radius:8px;border-left:4px solid var(--amb);background:light-dark(#fff8e1,#2c2716);margin:0 0 6px}
.msg.e{border-color:var(--red);background:light-dark(#fdecea,#321b19)}.msg.ok{border-color:var(--grn);background:light-dark(#e8f6ef,#15281f)}
.calc{font-variant-numeric:tabular-nums;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}table.t th{color:var(--mut);font-weight:600;font-size:12px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--card)}
.item .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.vn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.vn button{border:0;background:var(--card);color:var(--mut);font:700 13px Inter;width:40px;min-height:36px;cursor:pointer}
.vn button.on.V{background:var(--grn);color:#fff}.vn button.on.N{background:var(--red);color:#fff}.vn button.on.X{background:var(--mut);color:var(--bg)}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cl .ref{font-size:12px;color:var(--mut)}.cl input{grid-column:1/-1;min-height:36px;font-size:14px;padding:6px 9px}
.cl .hint{font-size:12px;font-weight:600}
.book td,.book th{white-space:nowrap}.book td.w{white-space:normal}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9;transition:opacity .3s}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.dlg .card{max-width:440px;width:100%}
.scroll{overflow-x:auto}
.small{font-size:12px;color:var(--mut)}
@media(max-width:600px){table.stack thead{display:none}table.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}table.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}table.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mut);font-size:12px}table.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Revízie<b>PRO</b></h1>
  <span class="small" style="color:#aab1b8">OPaOS odberných plynových zariadení · TPP 704 01 – R1</span>
  <nav class="main" id="nav">
    <button data-v="book" class="on">Kniha správ</button>
    <button data-v="edit">Správa</button>
    <button data-v="set">Nastavenia</button>
  </nav>
</header>
<main id="app"></main>
<div id="dlg"></div>
<script>
{
/* ================= DATA & STORAGE ================= */
const LS='reviziepro.v1';
let DB=null,UID=null;
const store={
  data:{settings:null,reports:[]},
  async load(){
    try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x)this.data=x}catch(e){}
    if(!this.data.settings)this.data.settings=defSettings();
  },
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify(this.data))}catch(e){}},
  async save(){
    this.saveLocal();
    if(DB&&UID){try{await DB.collection('data/users/'+UID).doc('state').set({json:JSON.stringify(this.data),ts:Date.now()})}catch(e){}}
  }
};
let saveT=null;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(()=>store.save(),600)};

function defSettings(){return{
  rt:{meno:'Adrián Kramer',firma:'EGMONT s.r.o.',adresa:'Hviezdoslavova 7, 078 01 Sečovce',ico:'46727710',osv:'165/3/12 - PZ - A - Bf, g1, g2, g3, h1, h2',rozsah:['A','Bf','Bg','Bh'],ap:'',miesto:'Sečovce',opr:''},
  meradla:[
    {nazov:'Analyzátor spalín',typ:'Testo 330-1',vc:'',kl:'',kd:''},
    {nazov:'Digitálny tlakomer',typ:'Testo 510',vc:'',kl:'',kd:''},
    {nazov:'Skúšobné zariadenie',typ:'Pressotest 200',vc:'',kl:'',kd:''},
    {nazov:'Detektor plynu',typ:'',vc:'',kl:'',kd:''},
    {nazov:'Detektor CO',typ:'',vc:'',kl:'',kd:''}],
  pena:'',
  cnt:{}
}}

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>new Date().toISOString().slice(0,10);

function newReport(){
  const s=store.data.settings,y=new Date().getFullYear();
  s.cnt[y]=(s.cnt[y]||0)+1;
  return{id:uid(),no:y+'-'+String(s.cnt[y]).padStart(3,'0'),created:Date.now(),
    druh:'per_opos',kontrola:'prevadzka',lehota:'pril10',dovod:'',od:today(),do:'',vyhot:today(),
    prev:{meno:'',adresa:'',ico:'',zast:''},
    obj:{obec:'',ulica:'',cp:'',byt:'',posch:'',supc:'',parc:'',ku:'',typ:'RD'},
    druhZar:'Rozvod plynu v rodinnom dome s plynovým spotrebičom',predmet:'OPZ NTL – od HUP po spotrebiče',
    zatr:{Bf:false,Bg:true,Bh:true,Ca:false},spotrSucast:true,
    pIn:'',mop:'2,1',zucastnil:'',poslOS:'',
    rozvod:{popis:'',useky:[{mat:'ocel',dn:'DN25',di:27.2,l:''},{mat:'ocel',dn:'DN20',di:21.6,l:''},{mat:'ocel',dn:'DN15',di:16,l:''}],hup:'',rtp:'nie je osadený – NTL sieť',rtpTyp:'',plynomer:'',korozia:'',pospaj:'vykonané',armat:'',bru:''},
    rooms:[],spot:[],
    mer:{tes:'',co:'',coTrv:false,fun:'',o2:'',coS:'',co2:'',lam:'',eta:'',tsp:'',tah:'',dp:'',pV:'',psch:false,
      fun2:{prev:'',plam1:'',plam2:'',voda:'',manP:'',manV:'',tPrev:'',tHav:''},protNast:''},
    tlak:{robi:false,typ:'obe',mont:'',montOpr:'',stav:'nový',dovod:'nový',datum:today(),medium:'vzduch',pP:'',pT:'',p1P:'',p2P:'',t1P:'',t2P:'',p1T:'',p2T:'',t1T:'',t2T:'',meradlo:'',okP:'',okT:'',arm:'',pozn:''},
    nap:{on:false,dovod:'',kedy:'',kto:''},
    cl:{},ned:[],predch:'',ostatne:'',doklady:'Uvedené v kontrolnom zozname (list 4, časť 1).',foto:false,
    uprava:'',nahl:'',zaverMan:'',vytl:'3',rozdel:'2× prevádzkovateľ, 1× RT',pozn:''}
}

/* ================= HELPERS ================= */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))};
const fmt=(v,d=2)=>isFinite(v)?v.toLocaleString('sk-SK',{maximumFractionDigits:d,minimumFractionDigits:0}):'–';
const dsk=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d?`${+d}. ${+m}. ${y}`:s};
const gp=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const sp=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k]});a[ks.at(-1)]=v};
function termin(dateStr,years){if(!dateStr)return'';const d=new Date(dateStr+'T12:00');const t=new Date(d.getFullYear()+years,d.getMonth()+1,0);return String(t.getMonth()+1).padStart(2,'0')+'/'+t.getFullYear()}
function termMonths(dateStr,months){if(!dateStr)return'';const d=new Date(dateStr+'T12:00');const t=new Date(d.getFullYear(),d.getMonth()+months+1,0);return String(t.getMonth()+1).padStart(2,'0')+'/'+t.getFullYear()}
function addDays(s,n){if(!s)return'';const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),400)},1800)}

/* ================= TABLES ================= */
const MAT={
  ocel:{n:'oceľ (závitová, STN 42 5710)',d:{DN15:16.0,DN20:21.6,DN25:27.2,DN32:35.9,DN40:41.8,DN50:53.0}},
  cu:{n:'meď',d:{'15×1':13,'18×1':16,'22×1':20,'28×1,5':25,'35×1,5':32,'42×1,5':39}},
  pe:{n:'PE SDR11',d:{'d32':26.0,'d40':32.6,'d50':40.8,'d63':51.4}},
  vl:{n:'iný / vlnovec / viacvrstvové',d:{}}
};
const TAB6={a:{n:'a) sporák / zostava varná doska + rúra',I:20,II:50},b:{n:'b) samostatná rúra / varič s 2 horákmi',I:10,II:30},c:{n:'c) plynová chladnička',I:6,II:6},d:{n:'d) ohrievač vody do 10 kW / zásobník do 2 kW',I:20,II:50},ea:{n:'e) ohrievač do 10 kW + sporák (a)',I:26,II:80},ebc:{n:'e) ohrievač do 10 kW + rúra/varič/chladnička (b, c)',I:20,II:60}};
const ZHOT={A:'A – bez odvodu spalín',Batm:'B – atmosférický horák s prerušovačom ťahu',Bven:'B – s ventilátorom (bez prerušovača ťahu)',C:'C – uzavretý (turbo / kondenzačný C)'};
const RDRUH={kuch:'kuchyňa',obyt:'iná obytná miestnosť',spal:'spálňa',kup:'kúpeľňa / sprcha',wc:'WC',spajza:'špajza / sklad potravín',chodba:'spoločná chodba / schodisko / úniková cesta',tech:'kotolňa / technická miestnosť',gar:'garáž',nebyt:'nebytový priestor',zhrom:'zhromaždisko osôb'};
const DRUH={vych:'východisková OP a OS',per_op:'periodická OP',per_opos:'periodická OP a OS',oprava:'OS po oprave / rekonštrukcii',opat:'pred opätovným uvedením do prevádzky',mimo:'mimoriadna'};

/* ================= CALCULATIONS ================= */
function vol(r){return r.rozvod.useky.reduce((s,u)=>{const L=num(u.l),d=num(u.di);return s+(isFinite(L)&&isFinite(d)?Math.PI/4*d*d*L/1000:0)},0)}
function pressTest(r){
  const mop=num(r.mop),V=vol(r);
  const pP=isFinite(mop)?Math.max(2.5*mop,5):NaN;
  const dur=V>50?30:15;
  const kor=(p1,t1,t2)=>{p1=num(p1);t1=num(t1);t2=num(t2);if(![p1,t1,t2].every(isFinite))return NaN;return(t2+273.15)/(t1+273.15)*(p1+101.325)-101.325};
  return{mop,V,pP,dur,korP:kor(r.tlak.p1P,r.tlak.t1P,r.tlak.t2P),korT:kor(r.tlak.p1T,r.tlak.t1T,r.tlak.t2T)}
}
function psch(r){const dp=num(r.mer.dp),V=isFinite(num(r.mer.pV))?num(r.mer.pV):vol(r);if(!isFinite(dp)||!(V>0))return null;const x=dp*V;
  return x<=2400?{x,k:0,t:'≤ 1 l/h – plynovod možno ďalej prevádzkovať'}:x<=12200?{x,k:1,t:'1–5 l/h – oprava / utesnenie do 30 dní'}:{x,k:2,t:'> 5 l/h – netesný, odstaviť'}}
function roomChecks(r){
  const out=[];
  r.rooms.forEach(rm=>{
    const L=num(rm.d),W=num(rm.s),H=num(rm.v),V=[L,W,H].every(isFinite)?L*W*H:num(rm.vol);
    const sp=r.spot.filter(s=>s.room===rm.id);if(!sp.length)return;
    const res={rm,V,msgs:[],st:0};const add=(t,k)=>{res.msgs.push({t,k});res.st=Math.max(res.st,k)};
    if(isFinite(H)&&H<2.3)add(`Svetlá výška ${fmt(H)} m < 2,3 m (čl. 12.2.9) – nad spotrebičom účinné odvetranie, do objemu len časť ≥ 2,3 m.`,1);
    const nebyt=['nebyt','zhrom','gar','tech'].includes(rm.druh)||r.obj.typ==='nebyt';
    const A=sp.filter(s=>s.zhot==='A'),Ba=sp.filter(s=>s.zhot==='Batm'),Bv=sp.filter(s=>s.zhot==='Bven'),C=sp.filter(s=>s.zhot==='C');
    if(rm.druh==='chodba'&&sp.length)add('Spotrebič na spoločnej chodbe / schodisku / únikovej ceste – zakázané (čl. 12.10.1).',2);
    if(rm.druh==='zhrom'&&(A.length||Ba.length||Bv.length))add('Zhromaždisko osôb – len spotrebiče zhotovenia C (čl. 12.10.1, 13.1.3).',2);
    if(rm.druh==='gar'){if(A.length||Ba.length||Bv.length)add('Garáž – len vykurovací spotrebič zhotovenia C (čl. 13.4).',2);else add('Garáž – overiť: povrch ≤ 300 °C, ochrana pred vozidlom, spodná hrana ≥ 0,5 m, pripojenie napevno / hadica s uzáverom 70 °C (čl. 13.4).',0)}
    if(A.length){
      if(['kup','wc','spajza'].includes(rm.druh))add('Zhotovenie A v kúpeľni / WC / špajzi – zakázané (čl. 12.2.4).',2);
      if(rm.druh==='spal'&&rm.byt!=='II')add('Zhotovenie A v spálni – zakázané (čl. 12.2.4 c), okrem bytu s jednou obytnou miestnosťou).',2);
      if(!rm.priamo)add('Zhotovenie A musí byť aspoň v priamo vetrateľnom priestore (čl. 12.2.3).',2);
      let req,kwA=A.reduce((s,x)=>s+(num(x.prikon)||0),0);
      if(nebyt)req=5*kwA;else req=A.reduce((s,x)=>s+(TAB6[x.t6]?TAB6[x.t6][rm.byt==='II'?'II':'I']:0),0);
      if(nebyt&&rm.nutVetr)req*=0.5;
      if(!nebyt&&rm.ods)req*=0.75;
      if(isFinite(V)&&req>0){
        if(V>=req)add(`Zhotovenie A: objem ${fmt(V,1)} m³ ≥ požadovaných ${fmt(req,1)} m³ (${nebyt?'čl. 13.2: 5 m³/kW':'tab. 6'}${rm.ods&&!nebyt?', −25 % odsávač':''}).`,0);
        else{const Vp=num(rm.prepV),ot=num(rm.otvor),need=Math.max(10*kwA,200);
          const ok=rm.prep&&V>=10&&isFinite(Vp)&&V+Vp>=1.3*req&&(rm.dvere||ot>=need)&&rm.prepPriamo;
          add(ok?`Zhotovenie A: vlastný objem ${fmt(V,1)} m³ < ${fmt(req,1)} m³, vyhovuje prepojením podľa čl. 12.2.7 (spolu ${fmt(V+Vp,1)} m³ ≥ 1,3 × ${fmt(req,1)}).`
            :`Zhotovenie A: objem ${fmt(V,1)} m³ < požadovaných ${fmt(req,1)} m³ – nevyhovuje (tab. 6 / čl. 13.2). Prepojenie podľa 12.2.7: ≥ 10 m³, spolu ≥ ${fmt(1.3*req,1)} m³, otvory ≥ ${fmt(need,0)} cm² pri podlahe a ≥ 1,8 m, obe priamo vetrateľné.`,ok?0:2)}
      }
      if(kwA>15&&A.some(x=>x.bezPoistky))add('Varné horáky bez poistiek plameňa > 15 kW – len s vetracím zariadením (čl. 12.2.3).',1);
      A.filter(x=>x.t6==='d'&&num(x.prikon)>10).forEach(()=>add('Prietokový ohrievač A nad 10 kW – nevyhovuje (čl. 12.2.8).',2));
    }
    if(Ba.length){
      const P=Ba.reduce((s,x)=>s+(num(x.prikon)||0),0);
      if(rm.podtlak)add('Atmosférický horák v miestnosti s možným podtlakom (digestor, ventilátor) – nevyhovuje (čl. 12.5.5, 13.3.2).',2);
      if(rm.druh==='kup')add(`Kúpeľňa: dvere otváravé von s prívodom vzduchu pri podlahe (čl. 12.5.3)${nebyt?'; v nebytových ≥ 20 m³ a ochrana pred vodou (čl. 13.3.1)':''}.`,1);
      let k=1;if(!rm.priamo&&P>7&&Ba.some(x=>!x.poistka))k=2;
      let req=k*P;if(nebyt&&rm.druh==='kup')req=Math.max(req,20);
      const Vc=rm.priamo?V:(isFinite(num(rm.prepV))?num(rm.prepV):NaN);
      const need=Math.max(10*P,200),ot=num(rm.otvor);
      const sol=(rm.otvorVon&&ot>=need)||(rm.prep&&(rm.dvere||ot>=need))||rm.vent||rm.skrina;
      if(P>0&&isFinite(Vc)){
        if(Vc>=req)add(`B atmosférický: ${fmt(Vc,1)} m³ ≥ ${fmt(req,1)} m³ (${k} m³/kW × ${fmt(P,1)} kW, čl. ${k===2?'12.5.4':'12.6.1'}${rm.priamo?'':'; počítaný objem susednej priamo vetrateľnej miestnosti – čl. 12.5.2'}). Prívod vzduchu ${fmt(1.6*P,1)} m³/h (čl. 12.6.2) – overiť škáry / otvory.`,0);
        else add(sol?`B atmosférický: objem ${fmt(Vc,1)} m³ < ${fmt(req,1)} m³, riešené podľa čl. 12.6.3 (otvor ≥ ${fmt(need,0)} cm² / prepojenie / ventilátor / skriňa).`
          :`B atmosférický: objem ${fmt(Vc,1)} m³ < ${fmt(req,1)} m³ a bez riešenia podľa čl. 12.6.3 – nevyhovuje. Potrebný otvor z vonku ≥ ${fmt(need,0)} cm² (10 cm²/kW, min. 200 cm²; potrubie +15 cm²/m).`,sol?0:2);
      }
    }
    if(Bv.length){const P=Bv.reduce((s,x)=>s+(num(x.prikon)||0),0);add(`B s ventilátorom: objem sa nekontroluje (čl. 12.7); prívod vzduchu ${fmt(1.6*P,1)} m³/h – škáry alebo riešenie podľa 12.6.3.`,rm.podtlak?1:0)}
    if(C.length&&!A.length&&!Ba.length&&!Bv.length)add('Zhotovenie C: bez požiadaviek na objem a prívod vzduchu (čl. 12.8); požiarna bezpečnosť, STN 92 0300.',0);
    if(rm.oknaVym)add('Po výmene okien / stavebných úpravách vykonať posúdenie výmeny vzduchu (čl. 12.3.2, 12.9.3).',1);
    out.push(res)
  });
  return out
}

function clHint(r,c){
  if(c[6]==='room'){const rc=roomChecks(r);if(!rc.length)return null;const m=Math.max(...rc.map(x=>x.st));return m===2?['N','výpočet: nevyhovuje']:m===1?['','výpočet: s upozornením']:['V','výpočet: vyhovuje']}
  if(c[6]==='press'){const t=r.tlak;if(t.okP==='nie'||t.okT==='nie')return['N','tlaková skúška: nevyhovela'];if(t.okP==='áno'||t.okT==='áno')return['V','tlaková skúška: vyhovela'];return null}
  if(c[6]==='leak'){if(r.mer.tes==='unik')return['N','zistený únik'];if(r.mer.tes==='ok')return['V','bez úniku'];return null}
  if(c[6]==='psch'){const p=psch(r);if(!p)return null;return[p.k?'N':'V',p.t]}
  return null
}

/* ================= VERDICT & WARNINGS ================= */
function analyse(r){
  const s=store.data.settings,w=[];const W=(t,k=1,step)=>w.push({t,k,step});
  const req=[['prev.meno','Prevádzkovateľ',1],['od','Dátum vykonania',1],['obj.obec','Obec objektu',1]];
  req.forEach(([p,n,st])=>{if(!gp(r,p))W(`Chýba povinný údaj: ${n}.`,1,st)});
  const roz=s.rt.rozsah||[];
  [['Bf','Bf'],['Bg','Bg'],['Bh','Bh']].forEach(([k,c])=>{if(r.zatr[k]&&!roz.includes(c))W(`Zatriedenie ${k} nie je v rozsahu osvedčenia RT – správu nevydávať.`,2,1)});
  s.meradla.forEach(m=>{if(m.kd&&r.od&&m.kd<r.od)W(`Kalibrácia „${m.nazov} ${m.typ}“ platila do ${dsk(m.kd)} – pred dátumom OPaOS.`,2,4)});
  if(s.rt.ap&&r.od&&s.rt.ap<r.od)W('Aktualizačná odborná príprava RT je po platnosti.',2,0);
  const N1=r.ned.some(n=>n.kat==='N1'&&!n.odstr);const ps=psch(r);
  const rc=roomChecks(r);const roomBad=rc.some(x=>x.st===2);
  if(r.mer.tes==='unik'&&!r.ned.some(n=>n.kat))W('Zistený únik, ale v nedostatkoch nie je kategória úniku (v budove vždy N1).',2,6);
  if(roomBad&&!r.ned.length)W('Kontrola umiestnenia spotrebiča nevyhovuje – doplň nedostatok.',1,6);
  clItems(r).forEach(c=>{if(r.cl[c[2]]?.v==='N'&&!r.ned.some(n=>n.cl===c[2]))W(`Položka „${c[3]}“ je N – chýba v nedostatkoch.`,1,6)});
  const pt=pressTest(r);
  if(r.tlak.robi){const pP=num(r.tlak.pP),pT=num(r.tlak.pT);
    if(isFinite(pP)&&isFinite(pt.pP)&&pP<pt.pP-1e-9)W(`Skúšobný tlak pevnosti ${fmt(pP)} kPa < ${fmt(pt.pP)} kPa (čl. 7.7).`,2,5);
    if(isFinite(pT)&&(pT>15||(isFinite(pt.mop)&&pT<pt.mop)))W('Skúšobný tlak tesnosti mimo rozsahu MOP – 15 kPa (čl. 7.8).',2,5)}
  if(r.mer.co&&num(r.mer.co)>0)W(`V ovzduší nameraný CO ${r.mer.co} ppm – posúdiť podľa výrobcu detektora / čl. 61 STN 38 6405.`,1,4);
  let z;
  if(r.zaverMan)z=+r.zaverMan;
  else if(N1||ps?.k===2||r.ned.some(n=>n.vaz==='ohroz'&&!n.odstr)||(r.mer.tes==='unik'&&!r.ned.some(n=>n.kat)))z=2;
  else if(r.ned.some(n=>!n.odstr)||ps?.k===1||(roomBad&&!r.ned.length)||clItems(r).some(c=>r.cl[c[2]]?.v==='N'&&!r.ned.some(n=>n.cl===c[2])))z=1;else z=0;
  return{w,z,rc,ps,pt,N1}
}

function terms(r){
  const d=r.od,os=r.druh!=='per_op',base=os?d:(r.poslOS||'');const t=[];
  if(r.zatr.Bg)t.push(['Rozvod B g',termin(d,3),base?termin(base,6):'–']);
  if(r.zatr.Bf)t.push(['Regulácia B f',termin(d,1),base?termin(base,3):'–']);
  if(r.zatr.Bh&&r.spotrSucast)t.push(['Spotrebiče B h',termin(d,1),base?termin(base,3):'–']);
  if(r.zatr.Ca)t.push(['Spotrebiče < 5 kW (C a)',termin(d,3),'podľa TPV']);
  return t
}

function stepState(r,a){const st=Array(STEPS.length).fill(0);a.w.forEach(x=>{if(x.step!=null)st[x.step]=Math.max(st[x.step],x.k)});return st}

function renderEdit(){
  const r=rep(),a=analyse(r),ss=stepState(r,a);
  app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Správa č. ${esc(r.no)}</h2><span class="small">${esc(r.prev.meno||'')} ${esc(r.obj.obec||'')}</span></div>
  <div class="steps" id="steps">${STEPS.map((n,i)=>`<button data-step="${i}" class="${i===step?'on':''}"><span class="dot ${ss[i]===2?'e':ss[i]===1?'w':''}"></span>${i+1}. ${n}</button>`).join('')}</div>
  <div class="lay"><section id="form" class="card">${stepHTML(r,step)}</section><aside class="verdict" id="verdict"></aside></div>

}

  h+=`<section>${head(4,'KONTROLNÝ ZOZNAM č. '+E(r.no))}<p class="c">pre výkon odbornej prehliadky a odbornej skúšky počas prevádzky OPZ – príloha H TPP 704 01 – R1 · V = vyhovel, N = nevyhovel, – = netýka sa</p>
  <h2>Základné technické údaje</h2><table class="k"><tr><th>Rozvod plynu</th><td>MOP ${E(r.mop)} kPa · skúšobný tlak ${fmt(pt.pP)} kPa · ${r.rozvod.useky.filter(u=>u.l).map(u=>E(u.dn)+' '+E(u.l)+' m').join(', ')} · ${E([...new Set(r.rozvod.useky.filter(u=>u.l).map(u=>MAT[u.mat]?.n.split(' (')[0]))].join(', '))} · zemný plyn</td></tr>
  ${(r.zatr.Bf||!/nie je/.test(r.rozvod.rtp))?`<tr><th>Regulácia tlaku</th><td>${E(r.pIn)} / ${E(r.mop)} kPa · ${E(r.rozvod.rtpTyp)}</td></tr>`:''}
  ${r.spot.map((x,j)=>`<tr><th>Spotrebič ${j+1}</th><td>${E(x.typ)} · ${E(x.vykon)} kW · výr. č. ${E(x.vc)}${x.rok?'/'+E(x.rok):''} · ${E(r.mop)} kPa · ${E(x.odvod)}</td></tr>`).join('')}</table>`;
  let last='';clItems(r).forEach(c=>{const v=r.cl[c[2]]||{};if(c[1]!==last){if(last)h+='</table>';h+=`<h2>${E(c[1])}</h2><table class="k cl"><tr><th>Položka</th><th>Predpis</th><th>V/N</th><th>Doplňujúce informácie</th></tr>`;last=c[1]}
    h+=`<tr><td>${E(c[3])}</td><td>${E(c[4])}</td><td class="vn">${ok(v.v)}</td><td>${E(v.p||'')}</td></tr>`});
  h+='</table>';
  const f=r.mer.fun2;if(Object.values(f).some(Boolean))h+=`<h2>Funkčná skúška – nastavené hodnoty</h2><table class="k"><tr><td>Prevetrávacia doba: ${E(f.prev)} s</td><td>Strážca plameňa štart / prevádzka: ${E(f.plam1)} / ${E(f.plam2)} s</td><td>Snímač tlaku vody: ${E(f.voda)} kPa</td></tr><tr><td>Manostat plynu: ${E(f.manP)} mbar</td><td>Manostat vzduchu: ${E(f.manV)} mbar</td><td>Termostat prevádzkový / havarijný: ${E(f.tPrev)} / ${E(f.tHav)} °C</td></tr>${r.mer.protNast?`<tr><td colspan="3">Protokol z nastavenia: ${E(r.mer.protNast)}</td></tr>`:''}</table>`;
  h+=`<div class="sig"><div></div><div></div><div class="line">${E(rt.meno)}, revízny technik</div></div></section>`;
  if(r.nap.on)h+=`<section>${head(5,'ZÁPIS o napustení plynu a odvzdušnení plynovodu')}<p class="c">podľa čl. 9.8 TPP 704 01 – R1, vzor príloha E</p><table class="k"><tr><th>Presné označenie objektu</th><td>${E(adr)}${r.obj.byt?', byt č. '+E(r.obj.byt):''}</td></tr><tr><th>Montážna organizácia</th><td>${E(r.tlak.mont)}</td></tr><tr><th>Meno a funkcia zodpovedného pracovníka</th><td>${E(r.nap.kto)}</td></tr><tr><th>Dôvod prerušenia dodávky a na aký čas</th><td>${E(r.nap.dovod)}</td></tr><tr><th>Dátum a hodina napustenia a odvzdušnenia</th><td>${E((r.nap.kedy||'').replace('T',' '))}</td></tr></table><div class="sig"><div></div><div class="line">Pracovník montážnej organizácie, pečiatka</div><div class="line">Majiteľ (správca) plynovodu, pečiatka</div></div></section>`;
  return`<!DOCTYPE html><html lang="sk"><head><meta charset="utf-8"><title>Správa ${E(r.no)} – ${E(r.prev.meno)}</title><style>
  @page{size:A4;margin:14mm 13mm}body{font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000;margin:0}section{page-break-after:always}section:last-child{page-break-after:auto}
  .ph{display:flex;justify-content:space-between;font-size:8.5pt;border-bottom:2px solid #000;padding-bottom:3px;margin-bottom:8px}h1{font-size:13.5pt;margin:6px 0 2px;text-align:center}h2{font-size:11pt;margin:10px 0 4px}
  .c{text-align:center;font-size:9pt;margin:0 0 8px}table.k{width:100%;border-collapse:collapse;margin:4px 0 6px;page-break-inside:auto}table.k th,table.k td{border:1px solid #555;padding:3px 5px;text-align:left;vertical-align:top;font-size:9.5pt}table.k th{background:#eee;font-weight:600}
  table.cl td.vn{text-align:center;font-weight:700;width:34px}tr{page-break-inside:avoid}.z{font-size:12pt;font-weight:700;border:2px solid #000;padding:6px 8px}.sm{font-size:8pt;color:#333;margin-top:10px}
  .sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:22px;font-size:9pt}.sig .line{border-top:1px solid #000;padding-top:3px;margin-top:34px;text-align:center}
  @media screen{body{background:#ddd}section{background:#fff;max-width:184mm;margin:10px auto;padding:12mm;box-shadow:0 1px 4px rgba(0,0,0,.3)}}
  </style></head><body>${h}</body></html>`
}
async function doPrint(r){
  const html=printHTML(r);
  if(!inFrame()){const w=window.open('','_blank');if(w){w.document.write(html+'<script>onload=()=>print()<\/script>');w.document.close();return}}
  const fn=`Sprava_${r.no}_${(r.prev.meno||'').replace(/[^\p{L}\p{N}]+/gu,'_')}.html`;
  try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data:html});toast('Tlačový súbor uložený – otvor a Ctrl+P → PDF');return}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fn;a.click();toast('Tlačový súbor stiahnutý')}catch(e){toast('Sťahovanie nie je dostupné – použi Náhľad')}
}

/* ================= EVENTS ================= */
function setVal(el){
  const path=el.dataset.k;if(!path)return;const scope=el.dataset.s==='set'?store.data.settings:rep();if(!scope)return;
  const v=el.type==='checkbox'?el.checked:el.value;sp(scope,path,v);
  if(el.dataset.dn!=null){const u=rep().rozvod.useky[+el.dataset.dn];u.di=MAT[u.mat].d[u.dn]??u.di}
  if(/^rozvod\.useky\.\d+\.mat$/.test(path)){const u=gp(rep(),path.replace('.mat',''));const k=Object.keys(MAT[u.mat].d);u.dn=k[0]||'';u.di=MAT[u.mat].d[u.dn]??''}
  saveSoon()
}
const REDRAW=/(^druh$|^zatr\.|^spotrSucast|^tlak\.(robi|typ)$|^nap\.on$|^mer\.psch$|^rozvod\.useky\.\d+\.(mat|dn)$|\.zhot$|^obj\.typ$|^rozvod\.rtp$)/;
app.addEventListener('input',e=>{const el=e.target;if(!el.dataset.k)return;setVal(el);
  if(view==='edit'){if(el.type!=='checkbox'&&el.tagName!=='SELECT'){renderVerdict();liveCalc()}}});
app.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.roz){const s=store.data.settings.rt;s.rozsah=el.checked?[...new Set([...s.rozsah,el.dataset.roz])]:s.rozsah.filter(x=>x!==el.dataset.roz);saveSoon();return}
  if(el.id==='imp'){const f=el.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.reports||!d.settings)throw 0;store.data=d;store.save();toast('Obnovené zo zálohy');render()}).catch(()=>toast('Súbor nie je záloha ReviziePRO'));return}
  if(!el.dataset.k)return;if(el.type==='checkbox'||el.tagName==='SELECT')setVal(el);
  if(view==='edit'){if(REDRAW.test(el.dataset.k)||el.type==='checkbox'||el.tagName==='SELECT'){const y=scrollY;const id=el.id;renderEdit();scrollTo(0,y);if(id){const n=document.getElementById(id);n&&n.focus({preventScroll:true})}}else renderVerdict()}
});
function liveCalc(){if(step===1){const t=document.querySelectorAll('#form tbody tr');rep().rozvod.useky.forEach((u,j)=>{const V=Math.PI/4*num(u.di)**2*num(u.l)/1000;const c=t[j]?.querySelector('td.calc');if(c)c.textContent=isFinite(V)?fmt(V,2):'–'});const s=document.querySelector('#form b .calc');if(s)s.textContent=fmt(vol(rep()),2)+' l'}}
app.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;renderBook();const n=$('#q');n.focus();n.setSelectionRange(p,p)}});
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-go]');if(!b)return;const d=b.dataset;const r=rep();
  const re=()=>{saveSoon();const y=scrollY;renderEdit();scrollTo(0,y)};
  if(b.id==='new'){const n=newReport();store.data.reports.push(n);cur=n.id;step=0;saveSoon();go('edit');return}
  if(d.open){cur=d.open;step=0;go('edit');return}
  if(d.dup){const o=store.data.reports.find(x=>x.id===d.dup);const n=newReport();const keep=JSON.parse(JSON.stringify(o));
    Object.assign(n,{prev:keep.prev,obj:keep.obj,druhZar:keep.druhZar,predmet:keep.predmet,zatr:keep.zatr,spotrSucast:keep.spotrSucast,pIn:keep.pIn,mop:keep.mop,rozvod:keep.rozvod,rooms:keep.rooms,spot:keep.spot,druh:'per_op',dovod:'periodická lehota',
      poslOS:o.druh!=='per_op'?o.od:o.poslOS,predch:`Predchádzajúca správa č. ${o.no} zo dňa ${dsk(o.od)}: `+(o.ned.filter(x=>!x.odstr).length?o.ned.filter(x=>!x.odstr).map((x,i)=>`${i+1}. ${x.popis} – `).join('\n')+'\n(doplniť: odstránené / pretrváva)':'neboli zistené nedostatky.')});
    store.data.reports.push(n);cur=n.id;step=0;saveSoon();go('edit');toast('Vytvorená ďalšia revízia '+n.no);return}
  if(d.del){const o=store.data.reports.find(x=>x.id===d.del);confirmDlg(`Zmazať správu ${o.no} (${o.prev.meno||'bez mena'})?`,()=>{store.data.reports=store.data.reports.filter(x=>x.id!==d.del);store.save();renderBook()});return}
  if(b.id==='exp'){const j=JSON.stringify(store.data,null,1);const fn='ReviziePRO_zaloha_'+today()+'.json';(async()=>{try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data:j});return}}catch(e){}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=fn;a.click()}catch(e){}})();return}
  if(d.go){go(d.go);return}
  if(d.mdel!=null){store.data.settings.meradla.splice(+d.mdel,1);saveSoon();renderSet();return}
  if(b.id==='madd'){store.data.settings.meradla.push({nazov:'',typ:'',vc:'',kl:'',kd:''});saveSoon();renderSet();return}
  if(d.step!=null){step=+d.step;renderEdit();return}
  if(b.id==='prev'){step=Math.max(0,step-1);renderEdit();scrollTo(0,0);return}
  if(b.id==='next'){if(step<STEPS.length-1){step++;renderEdit();scrollTo(0,0)}else doPrint(r);return}
  if(b.id==='uadd'){r.rozvod.useky.push({mat:'ocel',dn:'DN15',di:16,l:''});re();return}
  if(d.udel!=null){r.rozvod.useky.splice(+d.udel,1);re();return}
  if(b.id==='radd'){r.rooms.push({id:uid(),nazov:'',druh:'kuch',byt:'I',d:'',s:'',v:'',vol:'',priamo:true});re();return}
  if(d.rdel!=null){r.rooms.splice(+d.rdel,1);re();return}
  if(b.id==='sadd'){r.spot.push({druh:'kotol',typ:'',vc:'',rok:'',vykon:'',prikon:'',zhot:'C',t6:'a',room:r.rooms[0]?.id||'',odvod:'',prip:''});re();return}
  if(d.sdel!=null){r.spot.splice(+d.sdel,1);re();return}
  if(d.cl){const c=r.cl[d.cl]||(r.cl[d.cl]={});c.v=c.v===d.cv?'':d.cv;
    if(c.v==='N')addNed(r,d.cl);
    re();return}
  if(b.id==='clfill'){clItems(r).forEach(c=>{const h=clHint(r,c);const o=r.cl[c[2]]||(r.cl[c[2]]={});if(!o.v)o.v=h&&h[0]?h[0]:'V';if(o.v==='N')addNed(r,c[2])});re();return}
  if(b.id==='nadd'){r.ned.push({popis:'',rozpor:'',kat:'',vaz:'bez',opatrenie:'',termin:addDays(r.od,30),nahl:'',odstr:false});re();return}
  if(d.ndel!=null){r.ned.splice(+d.ndel,1);re();return}
  if(b.id==='print'){doPrint(r);return}
  if(b.id==='preview'){const pv=$('#pv');pv.innerHTML='';const f=document.createElement('iframe');f.style.cssText='width:100%;height:80vh;border:1px solid var(--line);border-radius:8px;background:#fff';f.setAttribute('sandbox','');f.srcdoc=printHTML(r);pv.append(f);return}
});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v==='edit'&&!rep()){toast('Najprv otvor alebo vytvor správu');return}go(b.dataset.v)});
function addNed(r,id){if(r.ned.some(n=>n.cl===id))return;const it=CL.find(x=>x[2]===id);let popis=it[3]+' – ',rozpor=it[4];
  if(it[6]==='room'){const bad=roomChecks(r).flatMap(x=>x.msgs.filter(m=>m.k===2).map(m=>x.rm.nazov+': '+m.t));if(bad.length)popis=bad.join(' ')}
  if(it[6]==='psch'){const p=psch(r);if(p)popis=`Skúška prevádzkyschopnosti: Δp·V = ${fmt(p.x,0)} – únik ${p.t}`;rozpor='čl. 10.6.4 TPP 704 01'}
  r.ned.push({cl:id,popis,rozpor,kat:id==='tes'?'N1':'',vaz:id==='tes'||(it[6]==='psch'&&psch(r)?.k===2)?'ohroz':'bez',opatrenie:'',termin:addDays(r.od,30),nahl:'',odstr:false})}
function confirmDlg(t,fn){const d=$('#dlg');d.innerHTML=`<div class="dlg"><div class="card"><p style="margin-top:0">${esc(t)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="dno">Zrušiť</button><button class="btn pri" id="dyes">Zmazať</button></div></div></div>`;
  $('#dno').onclick=()=>d.innerHTML='';$('#dyes').onclick=()=>{d.innerHTML='';fn()}}

/* ================= BOOT ================= */
(async()=>{
  await store.load();render();
  try{
    if(window.claude&&claude.use){
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(db&&user){UID=await user.id();DB=db;
        const snap=await db.collection('data/users/'+UID).doc('state').get();
        const remote=snap&&(snap.data?snap.data():snap);
        if(remote&&remote.json){const d=JSON.parse(remote.json);if(d&&d.reports&&(d.reports.length>=store.data.reports.length||!store.data.reports.length)){store.data=d;store.saveLocal()}else store.save()}
        else store.save();
        render()}
    }
  }catch(e){}
})();
}
</script>
